<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- وسم meta للوصف -->
    <meta name="description" content="موقع الجوهرة - انتظرونا قريباً. وجهتكم الأولى لكل ما هو جديد ومميز. ترقبوا انطلاقتنا قريباً.">
    
    <!-- وسم meta للكلمات الدلالية -->
    <meta name="keywords" content="الجوهرة, انتظرونا, قريباً, موقع الجوهرة, جوهرة, الجوهرة ff, جديد, مميز, under construction, coming soon">
    
    <!-- وسم meta للمؤلف -->
    <meta name="author" content="الجوهرة">
    
    <!-- وسم meta للروبوتات (اختياري لتحسين محركات البحث) -->
    <meta name="robots" content="index, follow">
    
    <title>الجوهرة | انتظرونا قريباً</title>
    
    <style>
        /* إعادة تعيين بسيطة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* أسود فاتح - يمكن تغييره إلى #222 أو #2c2c2c حسب الرغبة */
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة بسيطة (نقاط أو تأثير خفيف) */
        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 2rem;
            max-width: 700px;
            width: 90%;
            animation: fadeInUp 1.2s ease-out;
        }

        /* أيقونة أو شكل جوهري */
        .gem-icon {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            color: #e6b800; /* لون ذهبي باهت يشبه الجوهرة */
            text-shadow: 0 0 15px rgba(230, 184, 0, 0.4);
            animation: gentlePulse 3s infinite alternate;
            display: inline-block;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            word-break: break-word;
        }

        .subtitle {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 2rem;
            color: #cccccc;
            letter-spacing: 5px;
            word-spacing: 8px;
        }

        .description {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #aaaaaa;
            margin-bottom: 3rem;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .loader-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 2rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #e6b800;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            opacity: 0.8;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }

        /* اسم الموقع في التذييل */
        .footer-note {
            margin-top: 3rem;
            font-size: 1rem;
            color: #666;
            letter-spacing: 2px;
            font-weight: 400;
            border-top: 1px solid #333;
            padding-top: 1.8rem;
            display: inline-block;
        }

        .brand {
            color: #e6b800;
            font-weight: 600;
        }

        /* حركات */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gentlePulse {
            0% {
                transform: scale(1);
                opacity: 0.9;
            }
            100% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* تجاوب مع الشاشات الصغيرة */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.5rem;
                letter-spacing: 3px;
            }
            .description {
                font-size: 1rem;
            }
            .gem-icon {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>

    <div class="container">
        <!-- رمز الجوهرة باستخدام Unicode أو شكل ماسي -->
        <div class="gem-icon">💎</div>
        
        <h1>الجوهرة</h1>
        <div class="subtitle">انتظرونا قريباً</div>
        
        <p class="description">
            نحن نعمل بجد خلف الكواليس لنقدم لكم تجربة استثنائية. 
            قريباً سنفتح أبوابنا بإذن الله. تابعونا.
        </p>
        
        <!-- نقاط تحميل متحركة -->
        <div class="loader-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        
        <div class="footer-note">
            موقع <span class="brand">الجوهرة</span> | ff
        </div>
    </div>
</body>
</html>
